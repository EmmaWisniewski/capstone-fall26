[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ma-approps"
version = "0.1.0"
description = "Line-item dataset of Massachusetts state appropriations, re-runnable each year"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests==2.34.2",
    "lxml==6.1.3",
    "beautifulsoup4==4.15.0",
    "pandas==3.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[project.scripts]
ma-approps = "ma_approps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
